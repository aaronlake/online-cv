career-profile:
    title: Career Profile
    summary: |
        My 20+ year career in IT has taken a winding path. I've built a startup
        from ground-zero using dozens of AWS services, I split my startup time
        helping a growing AWS Professional Services partner build their pre-sales
        and product practices while helping clients begin or improve their cloud
        strategy. I built a Public Cloud practice for a traditional hosting 
        provider, ran numerous successful products from inception to MVP. I was
        a pre-sales architect for 5+ years, and previous to that did everything
        from linux administration and early-days devops to bash/Python/Ruby
        programming/scripting.

        My passion is in the startup and early-stage company growth phase, but in
        this day and age, everyone is trying to reset to accommodate changes in the
        industry. My goal is to be a champion of change, while implementing best
        practices for security, compliance and cost control.
experiences:
    - role: Co-Founder / Software Architect
      time: 2020 - Present
      company: Tenacity Cloud
      details: |
        Tenacity was born from a desire to consolidate security, compliance,
        best practice guard-rails and cost management in to a single tool. As a
        co-founder I helped build an idea into an MVP and successful 1.0 release
        which led to a $3M seed funding round. My primary role is Software
        Architecture but participated in every aspect of the company
        from development &amp; data strategy to sales, marketing &amp; product.
          - AWS Infrastructure Lead
          - Lambda/EC2/API Gateway/ECS/RDS/DynamoDB/Glue/Athena
          - Golang/Vue.js/Python/Bash
          - Terraform &amp; CloudFormation
          - Security/Compliance Ops implementation &amp; best practices
    - role: AWS Practice Lead
      time: 2020 - Present
      company: North Labs
      details: |
        While building Tenacity, one of our co-founders, where the Tenacity idea
        originated, had a need for someone to run Engineering and AWS partner 
        goals. Since Tenacity was pre-funding the fit worked well. I managed upwards
        of a dozen engineers, project management, served as a pre-sales architect,
        built FAST and Infrastructure as Code Jumpstart products. Served as implementation
        and hands on keyboard engineer on specific client initiatives.
          - Product lead on FAST &amp; Infrastructure as Code Jumpstart
          - AWS Practice Lead - Focus on Engineering &amp; Partner Initiatives
          - DevOps &amp; product implementation, cloud migration, migration planning
    - role: Cloud &amp; Product Consultant
      time: 2018 - Present
      company: Self Employed
    - role: Senior Product Manager
      time: 2019 - 2020
      company: Otava LLC., Ann Arbor, MI
      details: |
        Responsible for product management, developing technical and business
        requirements, price modeling and go to market for numerous Otava Cloud
        Services. Completed MVP to product launch of Public Cloud Transformation,
        Business Continuity and cloud adjacent services. Built new product
        development processes using an agile approach, on-boarded development,
        marketing and operations teams to leverage Atlassian tools to
        track and report development processes to sales and leadership.
          - Built AWS and Azure Digital Cloud Transformation practice
          - Responsible for Cost Modeling, Vendor Management and forecasting market trends
          - Formed relationships with Veeam, Cloudflare, Fortigate, SuperMicro, and Qumulo through contract negotiations new product offerings
          - Managed cross-functional marketing, sales, infrastructure and ops teams
    - role: Principal Cloud Architect
      time: 2015 - 2019
      company: Otava LLC., Ann Arbor, MI
      details: |
        Pre-sales architecture support and account management for numerous
        SMB to Fortune 100 accounts nationally and internationally. Served as
